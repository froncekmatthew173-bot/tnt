name: Build & Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install Lime
        run: haxelib install lime --quiet

      - name: Install OpenFL
        run: haxelib install openfl --quiet

      - name: Install Required Libraries
        run: |
          haxelib install hmm --quiet 2>/dev/null || true

      - name: Build HTML5
        run: haxelib run lime build html5

      - name: Set up website folder
        run: |
          mkdir -p website
          # Copy entire HTML5 export to website folder
          cp -r export/html5/bin/* website/
          ls website/ | head -20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4