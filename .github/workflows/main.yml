name: Build & Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: windows
            artifactName: windowsBuild
            artifactPath: export/release/windows/bin/**

          - name: Linux
            os: ubuntu-latest
            buildArgs: linux
            artifactName: linuxBuild
            artifactPath: export/linux/bin/**

          - name: macOS
            os: macos-latest
            buildArgs: osx
            artifactName: macBuild
            artifactPath: export/macos/bin/**

          - name: Android
            os: ubuntu-latest
            buildArgs: android
            artifactName: androidBuild
            artifactPath: export/android/bin/**

          - name: iOS
            os: macos-latest
            buildArgs: ios
            artifactName: iosBuild
            artifactPath: export/ios/bin/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Configure HAXEPATH
        shell: bash
        run: |
          HAXE_BIN=$(dirname "$(which haxe)")

          echo "HAXEPATH=$HAXE_BIN" >> $GITHUB_ENV
          echo "$HAXE_BIN" >> $GITHUB_PATH

          echo "HAXEPATH=$HAXE_BIN"
          which haxe
          haxe --version

      - name: Install HMM
        shell: bash
        run: |
          haxelib install hmm --quiet

      - name: Setup HMM
        shell: bash
        run: |
          export HAXEPATH=$(dirname "$(which haxe)")

          haxelib run hmm setup || true
          haxelib run hmm help || true

      - name: Install Dependencies
        shell: bash
        run: |
          export HAXEPATH=$(dirname "$(which haxe)")

          haxelib run hmm install

      - name: Windows Native Opus Libraries
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-libogg

      - name: Environment Diagnostics
        shell: bash
        run: |
          echo "===== HAXE VERSION ====="
          haxe --version

          echo ""
          echo "===== HAXELIB CONFIG ====="
          haxelib config

          echo ""
          echo "===== HAXELIB LIST ====="
          haxelib list

          echo ""
          echo "===== HMM JSON ====="
          cat hmm.json || true

          echo ""
          echo "===== GRIG AUDIO ====="
          haxelib path grig.audio || true

          echo ""
          echo "===== HXVLC ====="
          haxelib path hxvlc || true

      - name: Audio Diagnostics
        shell: bash
        run: |
          echo "===== AUDIOSTREAMTHING REFERENCES ====="
          grep -R "AudioStreamThing" . 2>/dev/null || true

          echo ""
          echo "===== OPUS REFERENCES ====="
          grep -R "opus" . 2>/dev/null || true

          echo ""
          echo "===== GRIG.AUDIO REFERENCES ====="
          grep -R "grig.audio" . 2>/dev/null || true

      - name: Windows Opus Diagnostics
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Write-Host "===== OPUS DLL/LIB FILES ====="

          Get-ChildItem `
            -Path "C:\" `
            -Recurse `
            -ErrorAction SilentlyContinue `
            -Include *.lib,*.dll |
          Where-Object {
            $_.Name -match "opus|ogg"
          } |
          Select-Object FullName

      - name: Compile
        run: haxelib run lime build ${{ matrix.buildArgs }}

      - name: Fix RC2104 FNF Error
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          if [ -f export/debug/windows/obj/ApplicationMain.rc ]; then
            echo "#define FNF" | cat - export/debug/windows/obj/ApplicationMain.rc > tmp.rc
            mv tmp.rc export/debug/windows/obj/ApplicationMain.rc
          fi

          if [ -f export/release/windows/obj/ApplicationMain.rc ]; then
            echo "#define FNF" | cat - export/release/windows/obj/ApplicationMain.rc > tmp.rc
            mv tmp.rc export/release/windows/obj/ApplicationMain.rc
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
