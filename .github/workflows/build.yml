name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: TNT

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install libVLC
        if: inputs.os == 'linux-latest'
        run: sudo apt install libvlc-dev libvlccore-dev

      - name: Install Libraries
        run: |-
          haxelib install hmm --quiet 2>/dev/null || true
          cd /home/runner/work/tnt/tnt && haxelib run hmm setup 2>/dev/null || true
          haxelib run hmm install --quiet 2>/dev/null || true

      - name: Setup Android SDK
        if: inputs.os == 'ubuntu-latest'
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2" 2>/dev/null || true
          echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android" >> $GITHUB_ENV

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Fix RC2104 FNF error (Windows only)
        if: inputs.os == 'windows-2022'
        run: |
          echo "#define FNF" | cat - export/debug/windows/obj/ApplicationMain.rc > /tmp/rc_debug.tmp && mv /tmp/rc_debug.tmp export/debug/windows/obj/ApplicationMain.rc
          echo "#define FNF" | cat - export/release/windows/obj/ApplicationMain.rc > /tmp/rc_release.tmp && mv /tmp/rc_release.tmp export/release/windows/obj/ApplicationMain.rc

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
