name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: windows
            artifactName: windowsBuild
            artifactPath: export\release\windows\bin\*
          - name: Linux
            os: ubuntu-latest
            buildArgs: linux
            artifactName: linuxBuild
            artifactPath: export/linux/bin/*
          - name: macOS
            os: macos-latest
            buildArgs: osx
            artifactName: macBuild
            artifactPath: export/macos/bin/*
          - name: Android
            os: ubuntu-latest
            buildArgs: android
            artifactName: androidBuild
            artifactPath: export/android/bin/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install Lime
        run: haxelib install lime --quiet

      - name: Install OpenFL
        run: haxelib install openfl --quiet

      - name: Install Libraries
        run: |-
          haxelib install hmm --quiet 2>/dev/null || true
          cd /home/runner/work/tnt/tnt && haxelib run hmm setup 2>/dev/null || true
          haxelib run hmm install --quiet 2>/dev/null || true

      - name: Install Flixel
        run: haxelib install flixel --quiet

      - name: Install Flixel Addons
        run: haxelib install flixel-addons --quiet

      - name: Compile
        run: haxelib run lime build ${{ matrix.buildArgs }}

      - name: Fix RC2104 FNF error (Windows only)
        if: matrix.os == 'windows-2022'
        run: |
          echo "#define FNF" | cat - export/debug/windows/obj/ApplicationMain.rc > /tmp/rc_debug.tmp && mv /tmp/rc_debug.tmp export/debug/windows/obj/ApplicationMain.rc
          echo "#define FNF" | cat - export/release/windows/obj/ApplicationMain.rc > /tmp/rc_release.tmp && mv /tmp/rc_release.tmp export/release/windows/obj/ApplicationMain.rc

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          upload_url: ${{ github.server_url }}/repos/${{ github.repository }}/releases/${{ github.event.inputs.tag_name }}/assets?name=${{ matrix.artifactName }}
          file: ${{ matrix.artifactPath }}
          asset_name: ${{ matrix.artifactName }}
          asset_content_type: application/zip

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          release_name: ${{ github.event.inputs.tag_name }}
          body: |
            ## ThursdayNightThrowdown v${{ github.event.inputs.tag_name }}

            Auto-generated build from main branch.

            ### Available Builds

            - **Windows**: Executable binary
            - **Linux**: Binary executable
            - **macOS**: Binary executable  
            - **Android**: APK/AAB file

            ### Installation

            Download the appropriate build for your platform and follow the setup instructions.

            ---
            *Generated by ThursdayNightThrowdown CI/CD*